{% extends 'tasks/layout.html' %}

{% block body %}
    <h1>Add Task</h1>
    <form action="{% url 'tasks:add_task' %}" method="post">
        {% csrf_token %}
        {{form}}
        <button type="submit">Add Task</button>
    </form>
    <a href="{% url 'tasks:index' %}">Back to tasks</a>
{% endblock %}
